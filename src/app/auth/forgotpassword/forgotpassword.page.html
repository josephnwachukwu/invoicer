<ion-header><ion-toolbar><ion-buttons slot="start"><ion-menu-button aria-label="Open menu"></ion-menu-button></ion-buttons><ion-title>Reset password</ion-title></ion-toolbar></ion-header>
<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Recover your account</ion-card-title>
      <ion-card-subtitle>We’ll email you a secure password-reset link.</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <ion-input type="email" label="Email" labelPlacement="stacked" fill="outline" formControlName="email" autocomplete="email"></ion-input>
        <ion-button class="ion-margin-top" type="submit" expand="block" [disabled]="form.invalid || sending()">
          {{ sending() ? 'Sending…' : 'Send reset link' }}
        </ion-button>
      </form>
      <ion-button fill="clear" expand="block" routerLink="/">Back to sign in</ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
