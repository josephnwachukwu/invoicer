<ion-header [translucent]="true">
  <ion-toolbar class="auth-toolbar">
    <ion-buttons slot="start"><ion-menu-button aria-label="Open menu"></ion-menu-button></ion-buttons>
    <ion-title>Invoicer</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="auth-page-bg">
  <main class="auth-shell">
    <section class="auth-intro" aria-labelledby="login-heading">
      <img class="brand-icon" src="assets/icons/icon-192.webp" alt="" />
      <p class="eyebrow">INVOICER FOR MOBILE</p>
      <h1 id="login-heading">Welcome back.</h1>
      <p class="intro-copy">Create, send, and track professional invoices wherever your work takes you.</p>
    </section>

    <ion-card class="auth-card">
      <ion-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="login()">
          <div class="field-group">
            <ion-input type="email" autocomplete="email" inputmode="email" label="Email address" labelPlacement="stacked" fill="outline" placeholder="you@company.com" formControlName="email"></ion-input>
          </div>
          <div class="field-group">
            <ion-input type="password" autocomplete="current-password" labelPlacement="stacked" label="Password" fill="outline" formControlName="password">
              <ion-input-password-toggle slot="end"></ion-input-password-toggle>
            </ion-input>
          </div>
          <ion-button class="submit-button" type="submit" expand="block" [disabled]="loginForm.invalid">
            Sign in securely
          </ion-button>
        </form>

        <nav class="auth-links" aria-label="Account help">
          <a routerLink="/forgotpassword">Forgot password?</a>
          <span>New to Invoicer? <a routerLink="/register">Create an account</a></span>
        </nav>
      </ion-card-content>
    </ion-card>
    <p class="privacy-note">Your invoice data is protected by Firebase Authentication and owner-scoped access controls.</p>
  </main>
</ion-content>
