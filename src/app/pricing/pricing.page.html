<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start"><ion-menu-button aria-label="Open menu"></ion-menu-button></ion-buttons>
    <ion-title>Plans</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Choose your plan</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-card>
    <ion-card-header><ion-card-title>Free</ion-card-title></ion-card-header>
    <ion-card-content>Create, save, and download professional invoices.</ion-card-content>
  </ion-card>
  <ion-card>
    <ion-card-header><ion-card-title>Premium</ion-card-title></ion-card-header>
    <ion-card-content>Company logos, premium themes, reminders, recurring invoices, online payments, and Epoch workflow tools.</ion-card-content>
  </ion-card>
  <ion-button expand="block" href="https://invoicer.me/#pricing">View current pricing</ion-button>
</ion-content>
